name: ✨

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded runs: a new commit makes the previous one irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  style-check:
    name: Spack style check ✨
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/checkout@v7
        with:
          # Full history: the diff base is the ref's previous tip.
          fetch-depth: 0
      - name: Fetch Spack style config and check script
        run: |
          # -O everywhere: wget writes 'name.1' rather than overwriting, and
          # the repo root already has a pyproject.toml that ruff would read.
          url=https://raw.githubusercontent.com/spack/spack-packages/f5642ce3dafc940e61f20a277e829f5edf5bd2d4
          wget -O requirements.txt $url/.github/workflows/requirements/style/requirements.txt
          wget -O pyproject.toml $url/pyproject.toml
          wget -O style_check.sh $url/.ci/style_check.sh
      - run: pip install -r requirements.txt
      - name: Run style check
        env:
          # Covers a whole multi-commit push, where HEAD^ would check only
          # the tip. Unset on pull_request (HEAD^ is already the base there)
          # and dangling after a force push or a branch's first push.
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            base=HEAD^
          fi
          sh style_check.sh "$base"
