name: UFL

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; pushes to 'main' finish. Per-workflow group,
# so the packages do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  py-fenics-ufl:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "2025.2", "2025.1", "2024.2", "2024.1"]

    env:
      # Python 3.14 changed reference counting; match the regression step.
      PYTEST_ADDOPTS: -k 'not test_strip_form_arguments_strips_data_refs'

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - id: spack
        uses: ./spack-fenics/.github/actions/test-package
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          spec: py-fenics-ufl@${{ matrix.version }}
          test-dependencies: 'true'
          test-root: ${{ matrix.version == 'main' }}
      - name: Test installed package
        shell: spack-bash {0}
        env:
          ENV_DIR: ${{ steps.spack.outputs.env-path }}
          ROOT_HASH: ${{ steps.spack.outputs.root-hash }}
        run: spack -v -e "$ENV_DIR" test run --fail-fast "/$ROOT_HASH"
      # NOTE: Reference counting changed in Python 3.14, leading to test failure.
      - name: Run tests
        shell: spack-bash {0}
        env:
          ENV_DIR: ${{ steps.spack.outputs.env-path }}
          ROOT_HASH: ${{ steps.spack.outputs.root-hash }}
        run: |
          spack env activate "$ENV_DIR"
          spack stage "/$ROOT_HASH"
          spack cd "/$ROOT_HASH"
          spack build-env "/$ROOT_HASH" -- python -m pytest -n auto -k "not test_strip_form_arguments_strips_data_refs" test/
      - name: Publish build cache
        if: always()
        uses: ./spack-fenics/.github/actions/publish-buildcache
        with:
          env-path: ${{ steps.spack.outputs.env-path }}
