name: Basix

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; pushes to 'main' finish. Per-workflow group,
# so the packages do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fenics-basix:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "0.11", "0.10", "0.9", "0.8"]
        spec: ["build_type=Developer %gcc@13", "build_type=Developer %clang@18"]

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - uses: ./spack-fenics/.github/actions/test-package
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          spec: fenics-basix@${{ matrix.version }} ${{ matrix.spec }}
          test-mode: root

  py-fenics-basix:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "0.11", "0.10", "0.9", "0.8"]
        # Make sure fenics-basix and py-fenics-basix build with same compiler/ABI.
        spec: ["+ufl %gcc@13 ^fenics-basix%gcc@13", "+ufl %clang@18 ^fenics-basix%clang@18"]

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - uses: ./spack-fenics/.github/actions/test-package
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          spec: py-fenics-basix@${{ matrix.version }} ${{ matrix.spec }}
          test-mode: root
