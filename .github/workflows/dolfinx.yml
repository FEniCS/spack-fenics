name: DOLFINx

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; pushes to 'main' finish. Per-workflow group,
# so the packages do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fenics-dolfinx:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # NOTE: clang sometimes likes stub or Intel MPI. Force MPI implementations.
        version: ["main", "0.11", "0.10", "0.9", "0.8"]
        spec: ["build_type=Developer %%c,cxx=clang@18 ^mpich", "build_type=Developer partitioners=kahip,parmetis,scotch +petsc +slepc +adios2 %%gcc@13 ^openmpi"]
    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PRTE_ALLOW_RUN_AS_ROOT: 1
      PRTE_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe   # Newer OpenMPI
      OMPI_MCA_rmaps_base_oversubscribe: true                 # Older OpenMPI

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - id: spack
        uses: ./spack-fenics/.github/actions/test-package
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          spec: fenics-dolfinx@${{ matrix.version }} ${{ matrix.spec }}
          test-dependencies: 'true'
          test-root: ${{ matrix.version == 'main' && contains(matrix.spec, 'gcc@13') }}
      - name: Test installed package
        shell: spack-bash {0}
        env:
          ENV_DIR: ${{ steps.spack.outputs.env-path }}
          ROOT_HASH: ${{ steps.spack.outputs.root-hash }}
        run: spack -v -e "$ENV_DIR" test run --fail-fast "/$ROOT_HASH"
      # FFCx compilation of poisson.py fails in ffcx/codegeneration/C/finite_element.py
      #
      # The shared action installs build/test dependencies even for cached roots.
      - name: Run tests (skip 0.8)
        shell: spack-bash {0}
        if: ${{ matrix.version != '0.8' }}
        env:
          ENV_DIR: ${{ steps.spack.outputs.env-path }}
          ROOT_HASH: ${{ steps.spack.outputs.root-hash }}
          # Externals, so not loadable specs; name them so the tests match
          # the library's compiler.
          CC: ${{ contains(matrix.spec, 'clang@18') && 'clang-18' || 'gcc' }}
          CXX: ${{ contains(matrix.spec, 'clang@18') && 'clang++-18' || 'g++' }}
          # cpp/test adds -Wno-c2y-extensions for any Clang, but it exists
          # only from Clang 19. -Wno-unknown-warning-option survives the
          # later -Werror, which promotes enabled warnings but does not
          # re-enable disabled ones; -Wno-error= would not.
          CXXFLAGS: ${{ contains(matrix.spec, 'clang@18') && '-Wno-unknown-warning-option' || '' }}
        run: |
          spack env activate "$ENV_DIR"
          spack load --first catch2 cmake fenics-dolfinx py-fenics-ffcx
          spack stage "/$ROOT_HASH"
          spack cd "/$ROOT_HASH"
          cmake -B build/test/ -S cpp/test/ -DCMAKE_BUILD_TYPE=Developer
          cmake --build build/test
          cd build/test
          ctest -V --output-on-failure -R unittests_np_1
          ctest -V --output-on-failure -R unittests_np_3
      - name: Publish build cache
        if: always()
        uses: ./spack-fenics/.github/actions/publish-buildcache
        with:
          env-path: ${{ steps.spack.outputs.env-path }}

  py-fenics-dolfinx:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "0.11", "0.10", "0.9", "0.8"]
        python-version: ["3.11", "3.13", "3.14"]
        # NOTE: Overspecification of %%clang@18 to fix ABI issues (std::string related?).
        # NOTE: clang sometimes likes stub or Intel MPI.
        spec: ["build_type=Developer +petsc4py +slepc4py %%gcc@13 ^petsc+mumps ^fenics-dolfinx+adios2 ^mpich",
               "build_type=Developer %%clang@18 ^mpich"]
        # Test new superlu-dist variant
        include:
          - version: "0.11"
            spec: "build_type=Developer %%gcc@13 ^fenics-dolfinx+superlu-dist ^mpich"
            python-version: "3.12"
    env:
      PYTEST_ADDOPTS: -k 'not test_cffi_expression and not test_symmetry_interior_facet_assembly[mesh1]'
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PRTE_ALLOW_RUN_AS_ROOT: 1
      PRTE_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe   # Newer OpenMPI
      OMPI_MCA_rmaps_base_oversubscribe: true                 # Older OpenMPI

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - id: spack
        uses: ./spack-fenics/.github/actions/test-package
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          spec: py-fenics-dolfinx@${{ matrix.version }} ${{ matrix.spec }} ^python@${{ matrix.python-version }}
          test-dependencies: 'true'
          test-root: ${{ matrix.version == 'main' && contains(matrix.spec, 'gcc@13') && matrix.python-version == '3.13' }}
      - name: Test installed package
        shell: spack-bash {0}
        env:
          ENV_DIR: ${{ steps.spack.outputs.env-path }}
          ROOT_HASH: ${{ steps.spack.outputs.root-hash }}
        run: spack -v -e "$ENV_DIR" test run --fail-fast "/$ROOT_HASH"
      # pytest@8.4 required for collision of [tool.pytest] and [tool.pytest.ini_options] since @9.0
      - name: Run tests (0.9)
        if: ${{ matrix.version == '0.9'}}
        shell: spack-bash {0}
        env:
          ENV_DIR: ${{ steps.spack.outputs.env-path }}
          ROOT_HASH: ${{ steps.spack.outputs.root-hash }}
          # KNOWN BAD: test_refine_interval fails on 0.9 with clang-18 only;
          # gcc@13 and 0.10+ pass. Old-release bug, so pin it off.
          SKIP_REFINE: ${{ contains(matrix.spec, 'clang@18') && 'and not test_refine_interval' || '' }}
          # KNOWN BAD: test_mpi_comm_refcount fails on 0.9 and 0.10 with
          # Python 3.14 (changed refcount semantics); pin it off there.
          SKIP_REFCOUNT: ${{ matrix.python-version == '3.14' && 'and not test_mpi_comm_refcount' || '' }}
        run: |
          spack env activate "$ENV_DIR"
          spack patch "/$ROOT_HASH"
          spack cd "/$ROOT_HASH"
          spack build-env "/$ROOT_HASH" -- python -m pytest -n auto -m "not petsc4py and not adios2" -k "not test_cffi_expression and not test_cube_distance $SKIP_REFINE $SKIP_REFCOUNT" python/test/unit
          spack build-env "/$ROOT_HASH" -- mpiexec -n 3 python -m pytest -m "not petsc4py and not adios2" -k "not test_cffi_expression and not test_cube_distance $SKIP_REFINE $SKIP_REFCOUNT" python/test/unit
      # NOTE: 0.8 tests run very slow - skip?
      - name: Run tests (not 0.8 and not 0.9)
        if: ${{ matrix.version != '0.8' && matrix.version != '0.9'}}
        shell: spack-bash {0}
        env:
          ENV_DIR: ${{ steps.spack.outputs.env-path }}
          ROOT_HASH: ${{ steps.spack.outputs.root-hash }}
          # KNOWN BAD: see 0.9 step; same on 0.10, fixed from 0.11.
          SKIP_REFCOUNT: ${{ matrix.version == '0.10' && matrix.python-version == '3.14' && 'and not test_mpi_comm_refcount' || '' }}
        run: |
          spack env activate "$ENV_DIR"
          spack patch "/$ROOT_HASH"
          spack cd "/$ROOT_HASH"
          spack build-env "/$ROOT_HASH" -- python -m pytest -n auto -m "not petsc4py and not adios2" -k "not test_cffi_expression and not test_symmetry_interior_facet_assembly[mesh1] $SKIP_REFCOUNT" python/test/unit
          spack build-env "/$ROOT_HASH" -- mpiexec -n 3 python -m pytest -m "not petsc4py and not adios2" -k "not test_cffi_expression and not test_symmetry_interior_facet_assembly[mesh1] $SKIP_REFCOUNT" python/test/unit
      - name: Run petsc4py and adios2 tests
        if: ${{ matrix.version != '0.8' && contains(matrix.spec, '+petsc4py') && contains(matrix.spec, '+adios2') }}
        shell: spack-bash {0}
        env:
          ENV_DIR: ${{ steps.spack.outputs.env-path }}
          ROOT_HASH: ${{ steps.spack.outputs.root-hash }}
          # KNOWN BAD: test_matrix_assembly_rectangular uses PETSc's exact
          # A_sub.equal(A0), so it is BLAS-sensitive: passes on openblas,
          # fails on netlib for 0.9-0.11. netlib is not optional, so pin it
          # off for those; main passes and still runs it.
          SKIP_EXACT: ${{ matrix.version != 'main' && 'and not test_matrix_assembly_rectangular' || '' }}
        run: |
          spack env activate "$ENV_DIR"
          spack patch "/$ROOT_HASH"
          spack cd "/$ROOT_HASH"
          spack build-env "/$ROOT_HASH" -- python -m pytest -n auto -m "petsc4py or adios2" -k "not test_cffi_expression and not test_symmetry_interior_facet_assembly[mesh1] $SKIP_EXACT" python/test/unit
          spack build-env "/$ROOT_HASH" -- mpiexec -n 3 python -m pytest -m "petsc4py or adios2" -k "not test_cffi_expression and not test_symmetry_interior_facet_assembly[mesh1] $SKIP_EXACT" python/test/unit
      - name: Publish build cache
        if: always()
        uses: ./spack-fenics/.github/actions/publish-buildcache
        with:
          env-path: ${{ steps.spack.outputs.env-path }}
