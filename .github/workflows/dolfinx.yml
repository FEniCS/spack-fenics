name: DOLFINx

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; pushes to 'main' finish. Per-workflow group,
# so the packages do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fenics-dolfinx:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # NOTE: clang sometimes likes stub or Intel MPI. Force MPI implementations.
        version: ["main", "0.11", "0.10", "0.9", "0.8"]
        spec: ["build_type=Developer %%c,cxx=clang@18 ^mpich", "build_type=Developer partitioners=kahip,parmetis,scotch +petsc +slepc +adios2 %%gcc@13 ^openmpi"]
    env:
      # Read by the recipes' install-time tests and passed to the MPI
      # launcher; see the comments there. Only Open MPI needs them in a
      # root container, so MPICH rows leave them empty.
      # NOTE: '--oversubscribe' is deprecated from Open MPI 5 (PRRTE
      # warns and maps it to '--map-by :oversubscribe'). It still works
      # on the 5.0.x that Spack concretizes; switch spelling if removed.
      MPIEXEC_PREFLAGS: ${{ contains(matrix.spec, '^openmpi') && '--allow-run-as-root --oversubscribe' || '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - id: spack
        uses: ./spack-fenics/.github/actions/test-package
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          spec: fenics-dolfinx@${{ matrix.version }} ${{ matrix.spec }}
          # The 0.8 full suites remain excluded; standalone demos still run.
          test-mode: ${{ matrix.version == '0.8' && 'dependencies' || 'root' }}

  py-fenics-dolfinx:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "0.11", "0.10", "0.9", "0.8"]
        python-version: ["3.11", "3.14", "3.15"]
        # NOTE: Overspecification of %%clang@18 to fix ABI issues (std::string related?).
        # NOTE: clang sometimes likes stub or Intel MPI.
        spec: ["build_type=Developer +petsc4py +slepc4py %%gcc@13 ^petsc+mumps ^fenics-dolfinx+adios2 ^mpich",
               "build_type=Developer %%clang@18 ^mpich"]
        # Test new superlu-dist variant
        include:
          - version: "0.11"
            spec: "build_type=Developer %%gcc@13 ^fenics-dolfinx+superlu-dist ^mpich"
            python-version: "3.12"
    env:
      # Read by the recipes' install-time tests and passed to the MPI
      # launcher; see the comments there. Only Open MPI needs them in a
      # root container, so MPICH rows leave them empty.
      # NOTE: '--oversubscribe' is deprecated from Open MPI 5 (PRRTE
      # warns and maps it to '--map-by :oversubscribe'). It still works
      # on the 5.0.x that Spack concretizes; switch spelling if removed.
      MPIEXEC_PREFLAGS: ${{ contains(matrix.spec, '^openmpi') && '--allow-run-as-root --oversubscribe' || '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - id: spack
        uses: ./spack-fenics/.github/actions/test-package
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          spec: py-fenics-dolfinx@${{ matrix.version }} ${{ matrix.spec }} ^python@${{ matrix.python-version }}
          # The 0.8 full suites remain excluded; standalone demos still run.
          test-mode: ${{ matrix.version == '0.8' && 'dependencies' || 'root' }}
