name: 🤖

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * MON" # weekly, Mondays 0200

# Cancel superseded runs: a new commit on a pull request makes the
# previous run's result irrelevant. Pushes to 'main' and scheduled runs
# are left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  style-check:
    name: ✨
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Fetch Spack CI scripts
        uses: actions/checkout@v7
        with:
          repository: spack/spack
          ref: v1.2.2
          path: spack-core
      - run: wget https://raw.githubusercontent.com/spack/spack-packages/f5642ce3dafc940e61f20a277e829f5edf5bd2d4/.github/workflows/requirements/style/requirements.txt
      - run: wget https://raw.githubusercontent.com/spack/spack-packages/f5642ce3dafc940e61f20a277e829f5edf5bd2d4/pyproject.toml
      - run: wget https://raw.githubusercontent.com/spack/spack-packages/f5642ce3dafc940e61f20a277e829f5edf5bd2d4/.ci/style_check.sh
      - run: pip install -r requirements.txt
      - run: chmod +x style_check.sh
      - run: ./style_check.sh HEAD^

  fenics-basix:
    needs: style-check
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "0.11", "0.10", "0.9", "0.8"]
        spec: ["build_type=Developer %gcc@13", "build_type=Developer %clang@18"]

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - uses: ./spack-fenics/.github/actions/test-package
        with:
          spec: fenics-basix@${{ matrix.version }} ${{ matrix.spec }}

  fenics-dolfinx:
    needs: style-check
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # NOTE: clang sometimes likes stub or Intel MPI. Force MPI implementations.
        version: ["main", "0.11", "0.10", "0.9", "0.8"]
        main_spec: ["build_type=Developer %%c,cxx=clang@18 ^mpich", "build_type=Developer partitioners=kahip,parmetis,scotch +petsc +slepc +adios2 %%gcc@13 ^openmpi"]
    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe   # Newer OpenMPI
      OMPI_MCA_rmaps_base_oversubscribe: true                 # Older OpenMPI

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - uses: ./spack-fenics/.github/actions/test-package
        with:
          spec: fenics-dolfinx@${{ matrix.version }} ${{ matrix.main_spec }} py-fenics-ffcx catch2 cmake
      # FFCx compilation of poisson.py fails in ffcx/codegeneration/C/finite_element.py
      #
      # NOTE: 'spack build-env' is deliberately not used to set up this step.
      # It reconstructs the *build* environment, which needs the package's
      # build-only dependencies (sed, perl, m4, autoconf, compiler-wrapper,
      # ...) to be installed. Those are not installed when the spec is served
      # whole from the buildcache, and the step then dies with "Not all
      # dependencies of fenics-dolfinx are installed". Compiling the tests
      # only needs the *runtime* environment of the installed library, which
      # is what 'spack load' provides; this is how DOLFINx's own ci.yml
      # builds cpp/test.
      - name: Run tests (skip 0.8)
        shell: spack-bash {0}
        if: ${{ matrix.version != '0.8' }}
        env:
          # The compilers are externals found by 'spack compiler find', so
          # they are not loadable specs and 'spack load' cannot put them in
          # the environment. Name them explicitly, matching the compiler in
          # the matrix spec, so the tests are built with the same compiler as
          # the library they link against.
          CC: ${{ contains(matrix.main_spec, 'clang@18') && 'clang-18' || 'gcc' }}
          CXX: ${{ contains(matrix.main_spec, 'clang@18') && 'clang++-18' || 'g++' }}
          # dolfinx's cpp/test adds -Wno-c2y-extensions for any compiler
          # identifying as Clang, with no version guard, but the flag only
          # exists from Clang 19; clang-18 rejects it as an unknown warning
          # option. It used to be harmless because 'spack build-env' put
          # spack's compiler wrapper in CXX and the wrapper drops -Werror
          # (config:flags:keep_werror), leaving a warning. Without the wrapper
          # -Werror is real, so turn off the unknown-flag diagnostic itself:
          # -Werror promotes warnings that are enabled and does not re-enable
          # disabled ones, so this survives the -Werror that dolfinx appends
          # afterwards (a -Wno-error= would not).
          CXXFLAGS: ${{ contains(matrix.main_spec, 'clang@18') && '-Wno-unknown-warning-option' || '' }}
        run: |
          spack env activate ./env
          spack load --first catch2 cmake fenics-dolfinx py-fenics-ffcx
          spack stage fenics-dolfinx@${{ matrix.version }} ${{ matrix.main_spec }}
          spack cd fenics-dolfinx@${{ matrix.version }} ${{ matrix.main_spec }}
          cmake -B build/test/ -S cpp/test/ -DCMAKE_BUILD_TYPE=Developer
          cmake --build build/test
          cd build/test
          ctest -V --output-on-failure -R unittests_np_1
          ctest -V --output-on-failure -R unittests_np_3


  fenics-ufcx:
    needs: style-check
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "0.11", "0.10", "0.9", "0.8"]
        spec: ["%gcc@13"]

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - uses: ./spack-fenics/.github/actions/test-package
        with:
          spec: fenics-ufcx@${{ matrix.version }} ${{ matrix.spec }}

  py-fenics-basix:
    needs: style-check
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "0.11", "0.10", "0.9", "0.8"]
        # Make sure fenics-basix and py-fenics-basix build with same compiler/ABI.
        spec: ["+ufl %gcc@13 ^fenics-basix%gcc@13", "+ufl %clang@18 ^fenics-basix%clang@18"]

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - uses: ./spack-fenics/.github/actions/test-package
        with:
          spec: py-fenics-basix@${{ matrix.version }} ${{ matrix.spec }}
      - name: Run tests
        if: ${{ matrix.version != '0.8' }}
        shell: spack-bash {0}
        run: |
          spack env activate ./env
          spack install --add py-pytest py-sympy py-pytest-xdist
          spack stage py-fenics-basix@${{ matrix.version }} ${{ matrix.spec }}
          spack cd py-fenics-basix@${{ matrix.version }} ${{ matrix.spec }}
          python -m pytest -n auto test/
      # NOTE: 0.8 has test_all_elements_included broken
      - name: Run tests
        if: ${{ matrix.version == '0.8' }}
        shell: spack-bash {0}
        run: |
          spack env activate ./env
          spack install --deprecated --add py-pytest py-sympy py-pytest-xdist
          spack stage --deprecated py-fenics-basix@${{ matrix.version }} ${{ matrix.spec }}
          spack cd py-fenics-basix@${{ matrix.version }} ${{ matrix.spec }}
          python -m pytest -n auto -k "not test_all_elements_included" test/

  py-fenics-dolfinx:
    needs: style-check
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "0.11", "0.10", "0.9", "0.8"]
        python-version: ["3.11", "3.13"]
        # NOTE: Overspecification of %%clang@18 to fix ABI issues (std::string related?).
        # NOTE: clang sometimes likes stub or Intel MPI.
        spec: ["build_type=Developer +petsc4py +slepc4py %%gcc@13 ^petsc+mumps ^fenics-dolfinx+adios2 ^mpich",
               "build_type=Developer %%clang@18 ^mpich"]
        # Test new superlu-dist variant
        include:
          - version: "0.11"
            spec: "build_type=Developer %%gcc@13 ^fenics-dolfinx+superlu-dist ^mpich"
            python-version: "3.12"
    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe   # Newer OpenMPI
      OMPI_MCA_rmaps_base_oversubscribe: true                 # Older OpenMPI

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - uses: ./spack-fenics/.github/actions/test-package
        with:
          spec: py-fenics-dolfinx@${{ matrix.version }} ${{ matrix.spec }} ^python@${{ matrix.python-version }}
      # pytest@8.4 required for collision of [tool.pytest] and [tool.pytest.ini_options] since @9.0
      - name: Run tests (0.9)
        if: ${{ matrix.version == '0.9'}}
        shell: spack-bash {0}
        env:
          # KNOWN BAD: all 27 parametrisations of test_refine_interval fail on
          # 0.9 built with clang-18. The same 0.9 source with gcc@13 passes
          # them, 0.10 and later pass on both compilers, and it reproduces
          # under either BLAS provider and with a fortran-capable mpich - so
          # it is a dolfinx 0.9-on-clang problem, not CI configuration. 0.9 is
          # an old release and will not be fixed, so the test is pinned off
          # for that one combination rather than left permanently red.
          SKIP_REFINE: ${{ contains(matrix.spec, 'clang@18') && 'and not test_refine_interval' || '' }}
        run: |
          spack env activate ./env
          spack install --deprecated --add py-pytest@8.4 py-scipy py-pytest-xdist ^python@${{ matrix.python-version }}
          spack stage py-fenics-dolfinx@${{ matrix.version }} ${{ matrix.spec }} ^python@${{ matrix.python-version }}
          spack cd py-fenics-dolfinx@${{ matrix.version }} ${{ matrix.spec }} ^python@${{ matrix.python-version }}
          python -m pytest -n auto -m "not petsc4py and not adios2" -k "not test_cffi_expression and not test_cube_distance $SKIP_REFINE" python/test/unit
          mpiexec -n 3 python -m pytest -m "not petsc4py and not adios2" -k "not test_cffi_expression and not test_cube_distance $SKIP_REFINE" python/test/unit
      # NOTE: 0.8 tests run very slow - skip?
      - name: Run tests (not 0.8 and not 0.9)
        if: ${{ matrix.version != '0.8' && matrix.version != '0.9'}}
        shell: spack-bash {0}
        run: |
          spack env activate ./env
          spack install --add py-pytest py-scipy py-pytest-xdist ^python@${{ matrix.python-version }}
          spack stage py-fenics-dolfinx@${{ matrix.version }} ${{ matrix.spec }} ^python@${{ matrix.python-version }}
          spack cd py-fenics-dolfinx@${{ matrix.version }} ${{ matrix.spec }} ^python@${{ matrix.python-version }}
          python -m pytest -n auto -m "not petsc4py and not adios2" -k "not test_cffi_expression and not test_symmetry_interior_facet_assembly[mesh1]" python/test/unit
          mpiexec -n 3 python -m pytest -m "not petsc4py and not adios2" -k "not test_cffi_expression and not test_symmetry_interior_facet_assembly[mesh1]" python/test/unit
      - name: Run petsc4py and adios2 tests
        if: ${{ matrix.version != '0.8' && contains(matrix.spec, '+petsc4py') && contains(matrix.spec, '+adios2') }}
        shell: spack-bash {0}
        env:
          # TestPETScAssemblers::test_matrix_assembly_rectangular compares a
          # nest submatrix against a separately assembled one with
          # A_sub.equal(A0), which is PETSc's *exact* comparison. That makes
          # it sensitive to the BLAS provider (basix tabulates element tables
          # through dgemm): it passed 6/6 on openblas and fails on netlib on
          # 0.9/0.10/0.11. netlib is not optional here - openblas@0.3.34
          # segfaults on the AMD runners, see the note in the test-package
          # action - so the test is deselected for the tagged versions. It
          # passes on main, so coverage is kept there.
          SKIP_EXACT: ${{ matrix.version != 'main' && 'and not test_matrix_assembly_rectangular' || '' }}
        run: |
          spack env activate ./env
          spack stage py-fenics-dolfinx@${{ matrix.version }} ${{ matrix.spec }} ^python@${{ matrix.python-version }}
          spack cd py-fenics-dolfinx@${{ matrix.version }} ${{ matrix.spec }} ^python@${{ matrix.python-version }}
          python -m pytest -n auto -m "petsc4py or adios2" -k "not test_cffi_expression and not test_symmetry_interior_facet_assembly[mesh1] $SKIP_EXACT" python/test/unit
          mpiexec -n 3 python -m pytest -m "petsc4py or adios2" -k "not test_cffi_expression and not test_symmetry_interior_facet_assembly[mesh1] $SKIP_EXACT" python/test/unit

  py-fenics-ffcx:
    needs: style-check
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "0.11", "0.10", "0.9", "0.8"]

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      # NOTE: Python built with GCC, otherwise cffi can try for an odd compiler.
      - uses: ./spack-fenics/.github/actions/test-package
        with:
          spec: py-fenics-ffcx@${{ matrix.version }} ^python %%gcc@13 py-numba
      # NOTE: ffcx version 0.8 currently broken
      - name: Run tests
        if: ${{ matrix.version != '0.8' }}
        shell: spack-bash {0}
        run: |
          spack env activate ./env
          spack install --add py-pytest py-sympy py-pytest-xdist
          spack stage py-fenics-ffcx@${{ matrix.version }}
          spack cd py-fenics-ffcx@${{ matrix.version }}
          python -m pytest -n auto test/

  py-fenics-ufl:
    needs: style-check
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "2025.2", "2025.1", "2024.2", "2024.1"]

    steps:
      - uses: actions/checkout@v7
        with:
          path: spack-fenics
      - uses: ./spack-fenics/.github/actions/test-package
        with:
          spec: py-fenics-ufl@${{ matrix.version }}
      # NOTE: Reference counting changed in Python 3.14, leading to test failure.
      - name: Run tests
        shell: spack-bash {0}
        run: |
          spack env activate ./env
          spack install --add py-pytest py-pytest-xdist
          spack stage py-fenics-ufl@${{ matrix.version }}
          spack cd py-fenics-ufl@${{ matrix.version }}
          python -m pytest -n auto -k "not test_strip_form_arguments_strips_data_refs" test/
