name: test-spack
description: 'Builds a spack package from given spack-spec'
inputs:
  spec:
    description: 'Spack spec syntax'
    required: true
    type: string
runs:
  using: "composite"
  steps:
    - name: Install Spack requirements
      shell: sh
      run: |
        apt-get -y update
        apt-get install -y file bzip2 ca-certificates g++ gcc gfortran git gzip lsb-release patch python3 tar unzip xz-utils zstd

    - name: Set up spack
      uses: spack/setup-spack@v3
      with:
        spack_ref: v1.2.2
        # spack/spack-packages @ 2026-08-15
        packages_ref: f5642ce3dafc940e61f20a277e829f5edf5bd2d4

    - name: Install clang-18
      shell: sh
      if: contains(inputs.spec, 'clang@18')
      run: apt-get install -y clang-18

    - name: Add repos
      shell: spack-bash {0}
      run: |
        spack repo add --name fenics $GITHUB_WORKSPACE/spack-fenics/spack_repo/fenics
        spack config get repos
        spack repo list

    - name: Add cache
      shell: spack-bash {0}
      run: |
         # NOTE: the shared 'spack-buildcache' package is deliberately not a
         # mirror here. Its contents are unpadded, and with a padded install
         # tree (below) spack cannot relocate them - anything embedding its
         # prefix in a binary fails with CannotGrowString. Spack's own
         # github-actions-buildcache, added by setup-spack, *is* padded and
         # stays usable.
         # Own package (auto-created on first push): the shared
         # 'spack-buildcache' package above was created by dolfinx's CI,
         # and GHCR ties push access to a package's originating repo, so
         # this repo's GITHUB_TOKEN gets a 403 trying to push there.
         spack mirror add --unsigned --oci-username-variable GITHUB_USER --oci-password-variable GITHUB_TOKEN \
           push-buildcache oci://ghcr.io/fenics/spack-fenics-buildcache
         spack config add "packages:all:require:['os=ubuntu24.04','target=x86_64_v3']"
         # Pad the install tree so pushed binaries stay relocatable: spack can
         # only shrink a prefix when relocating (relocate_text.py raises
         # CannotGrowString otherwise), so binaries built at a short prefix are
         # unusable to anyone whose prefix is longer. Padding makes the build
         # prefix longer than any consumer's, which is what lets this cache be
         # filled from somewhere other than a runner. Note this also means the
         # unpadded shared 'spack-buildcache' above can no longer be read.
         spack config add "config:install_tree:padded_length:128"
         # OpenBLAS for BLAS/LAPACK. This is spack's default provider, but
         # both virtuals are stated explicitly so the choice does not depend
         # on that default, and so a future change here has to set the two
         # together: pinning only blas would leave the other virtual free to
         # pick a different provider.
         spack config add "packages:blas:require:openblas"
         spack config add "packages:lapack:require:openblas"

    - name: Compiler find
      shell: spack-bash {0}
      run: spack compiler find

    - name: Create env
      shell: spack-bash {0}
      run: spack env create -d ./env

    - name: Add specs
      shell: spack-bash {0}
      run: spack -e ./env add ${{ inputs.spec }}

    - name: Concretize
      shell: spack-bash {0}
      run: |
        spack -e ./env config add concretizer:unify:true
        # Do not let the buildcache steer the solve. With reuse on (spack's
        # default) the concretizer prefers specs it finds in the mirrors, so
        # the resulting hashes depend on what the cache happens to hold at
        # that moment. With 66 jobs pushing to one mirror, that moves under
        # us: a cache warmed for one solve is asked for different hashes by
        # the next, and jobs rebuild large parts of the graph from source.
        # Turning reuse off makes the solve a function of the recipes and
        # this config alone, so warmed hashes are the ones CI asks for.
        # Binaries are still installed from the cache whenever a hash
        # matches. DOLFINx's own CI environment sets this for the same
        # reason.
        spack -e ./env config add concretizer:reuse:false
        spack -e ./env concretize --deprecated -j 4

    - name: Install
      shell: spack-bash {0}
      run: >
        spack -e ./env install --deprecated -j 4
        --log-format junit
        --log-file log.xml

    # Skipped for pull requests from forks: those run with a read-only
    # GITHUB_TOKEN regardless of the 'permissions' block, so the push
    # would 401 as soon as it had anything to upload, failing a
    # contributor's job on a step that tests nothing. Reads are
    # anonymous, so forked-repo builds still take from the cache.
    - name: Push packages to cache
      if: >-
        ${{ !cancelled() && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository) }}
      shell: spack-bash {0}
      run: >
        spack -e ./env buildcache push --base-image ubuntu:24.04
        --allow-missing --update-index push-buildcache

    - name: Upload log
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.spec }}-log
        path: log.xml
