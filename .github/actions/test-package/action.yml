name: test-package
description: >-
  Build a Spack package from the given spec, optionally run its tests, and
  publish what was built to the build cache.
inputs:
  spec:
    description: >-
      Spack spec syntax. List the package under test first: the Concretize
      step checks that the first root matches the first name here.
    required: true
  test-mode:
    description: >-
      What to do about the root's tests. 'none': plain install. 'dependencies':
      install the root's test dependencies so 'spack test run' works, but do
      not run its install-time tests, leaving the root free to come from the
      cache. 'root': also build the root from source and run its install-time
      tests. Neither mode tests the dependencies themselves.
    default: 'none'
  env-path:
    description: >-
      Directory for the Spack environment. Left in place for the rest of the
      job; read it back from the env-path output rather than repeating it.
    default: ./env
  registry-user:
    description: 'Username for the ghcr.io build cache.'
    default: ${{ github.actor }}
  registry-token:
    description: >-
      Token for the ghcr.io build cache; pass secrets.GITHUB_TOKEN. Exported
      as GHCR_TOKEN, since later install steps re-read the mirror.
    required: true
outputs:
  env-path:
    description: 'Directory of the Spack environment holding the built spec.'
    value: ${{ inputs.env-path }}
runs:
  using: "composite"
  steps:
    - name: Install Spack requirements
      shell: sh
      env:
        SPEC: ${{ inputs.spec }}
        DEBIAN_FRONTEND: noninteractive
      run: |
        # libclang-rt-18-dev is only a *recommend* of clang-18, so with
        # recommends off any -fsanitize= link fails without it.
        case "$SPEC" in
          *clang@18*) clang="clang-18 libclang-rt-18-dev" ;;
          *) clang="" ;;
        esac
        # Root inside the container, but not on a bare runner.
        sudo=$(command -v sudo || true)
        $sudo apt-get -y update
        # Drops 65 of 174 packages, none of them build inputs: spack builds
        # its own make, curl, libffi and so on.
        # Keep GCC 13 available for the matrix alongside Ubuntu's default GCC.
        $sudo apt-get install -y --no-install-recommends \
          file bzip2 ca-certificates g++ gcc gfortran g++-13 gcc-13 gfortran-13 git gzip lsb-release \
          patch python3 tar unzip xz-utils zstd $clang
        $sudo rm -rf /var/lib/apt/lists/*

    - name: Set up spack
      # Pinned: spack_ref and packages_ref are, so a mutable tag here would
      # be the build's one unpinned input.
      uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3 # v3
      with:
        spack_ref: v1.2.2
        # spack/spack-packages @ 2026-10-25
        packages_ref: ec33c8840c64bd5449f34d9f42fd96790ddb7569

    # Job-wide, not step-local: mirrors.yaml stores these names, and spack
    # re-resolves them in every later install step. Not GITHUB_*, which
    # $GITHUB_ENV refuses.
    - name: Export build cache credentials
      shell: bash
      env:
        REGISTRY_USER: ${{ inputs.registry-user }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        echo "::add-mask::$REGISTRY_TOKEN"
        echo "GHCR_USER=$REGISTRY_USER" >> "$GITHUB_ENV"
        echo "GHCR_TOKEN=$REGISTRY_TOKEN" >> "$GITHUB_ENV"

    - name: Add repos
      shell: spack-bash {0}
      run: |
        # From the action's own location, so callers can check out anywhere.
        repo_dir=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)
        spack repo add --name fenics "$repo_dir/spack_repo/fenics"
        spack config get repos
        spack repo list

    - name: Add cache
      shell: spack-bash {0}
      run: |
         # GHCR ties push access to a package's originating repo, which for
         # this one is FEniCS/dolfinx: this repo must be on its Actions
         # access list with the Write role, or every push 403s.
         spack mirror add --unsigned --oci-username-variable GHCR_USER --oci-password-variable GHCR_TOKEN \
           push-buildcache oci://ghcr.io/fenics/spack-buildcache
         spack config add "packages:all:require:['os=ubuntu26.04','target=x86_64_v3']"
         # Pad so pushed binaries stay relocatable: spack can only shrink a
         # prefix, so the build prefix must exceed any consumer's.
         spack config add "config:install_tree:padded_length:128"
         # netlib, NOT openblas: openblas@0.3.34's Zen kernels segfault on
         # high-degree hexahedral H(curl), visible only on the AMD runners.
         # Both virtuals, or openblas returns as the lapack provider;
         # 'require', since a providers preference is only a tie-breaker.
         spack config add "packages:blas:require:netlib-lapack"
         spack config add "packages:lapack:require:netlib-lapack"

    - name: Compiler find
      shell: spack-bash {0}
      run: spack compiler find

    # Spec and env path arrive as variables: GitHub substitutes ${{ }}
    # before bash parses the line, so a metacharacter in a spec would run.
    - name: Create env
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
      run: spack env create -d "$ENV_DIR"

    - name: Add specs
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
        SPEC: ${{ inputs.spec }}
      # $SPEC unquoted: a spec list is meant to split on whitespace here.
      run: spack -e "$ENV_DIR" add $SPEC

    - name: Concretize
      id: concretize
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
        TEST_MODE: ${{ inputs.test-mode }}
        SPEC: ${{ inputs.spec }}
      run: |
        spack -e "$ENV_DIR" config add concretizer:unify:true
        # Keep the buildcache out of the solve: with reuse on, hashes depend
        # on what the mirror happens to hold, and concurrent jobs push to it.
        # Binaries are still installed on a hash match.
        spack -e "$ENV_DIR" config add concretizer:reuse:false
        args=(--deprecated -j "$(nproc)")
        case "$TEST_MODE" in
          none) ;;
          dependencies|root) args+=(--test=root) ;;
          *) echo "::error::Invalid test-mode: $TEST_MODE"; exit 1 ;;
        esac
        spack -e "$ENV_DIR" concretize "${args[@]}"
        # Tests run against the FIRST concretized root, so the package under
        # test must be listed first. A mis-ordered input would otherwise test
        # the wrong package and still go green, so compare the root against
        # the first name in the input and fail loudly on a mismatch.
        root=$(spack -e "$ENV_DIR" python -c 'import spack.environment as ev; r = ev.active_environment().concrete_roots()[0]; print(r.dag_hash(), r.name, int(r.satisfies("^openmpi")), r.format("{name}{@version}"))')
        read -r root_hash root_name has_openmpi root_desc <<<"$root"
        want=${SPEC%%[[:space:]]*}
        want=${want%%[@%+~^=]*}
        if [ "$want" != "$root_name" ]; then
          echo "::error::List the package under test first in 'spec':" \
               "first root is '$root_name', but 'spec' starts with '$want'"
          exit 1
        fi
        echo "Root under test: $root_desc (/$root_hash)"
        echo "hash=$root_hash" >> "$GITHUB_OUTPUT"
        # The recipes pass MPIEXEC_PREFLAGS to mpiexec. Open MPI refuses to
        # run as root, which container jobs are, or to start more ranks than
        # cores; MPICH needs neither flag. A caller's own value wins.
        # NOTE: '--oversubscribe' is deprecated from Open MPI 5 (PRRTE warns
        # and maps it to '--map-by :oversubscribe'). It still works on the
        # 5.0.x that Spack concretizes; switch spelling if removed.
        if [ "$has_openmpi" = 1 ] && [ -z "${MPIEXEC_PREFLAGS+set}" ]; then
          echo "MPIEXEC_PREFLAGS=--allow-run-as-root --oversubscribe" >> "$GITHUB_ENV"
        fi

    - name: Install
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
        TEST_MODE: ${{ inputs.test-mode }}
      run: |
        base=(--deprecated -j "$(nproc)")
        args=("${base[@]}" --log-format junit --log-file log.xml)
        case "$TEST_MODE" in
          dependencies)
            # The root may come from the cache, but 'spack test run' needs
            # its test dependencies. Install just those, by hash: a cached
            # root brings none of them, and --include-build-deps would pull
            # in the build tools of every cached package in the DAG.
            test_deps=$(spack -e "$ENV_DIR" python -c 'import spack.environment as ev; r = ev.active_environment().concrete_roots()[0]; print(" ".join("/" + d.dag_hash() for d in r.dependencies(deptype="test")))')
            # Guarded: with no specs, 'spack install' installs the whole env.
            if [ -n "$test_deps" ]; then
              # $test_deps unquoted: one hash per word.
              spack -e "$ENV_DIR" install "${base[@]}" \
                --log-format junit --log-file log-deps.xml $test_deps
            fi
            ;;
          root)
            args+=(--test=root --use-buildcache=package:never,dependencies:auto)
            ;;
        esac
        spack -e "$ENV_DIR" install "${args[@]}"

    - name: Run stand-alone tests
      if: ${{ inputs.test-mode != 'none' }}
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
        ROOT_HASH: ${{ steps.concretize.outputs.hash }}
      # On failure dump the full test log; the summary alone rarely says why
      # a build or demo run failed.
      run: >-
        spack -v -e "$ENV_DIR" test run --fail-fast "/$ROOT_HASH"
        || { spack -e "$ENV_DIR" test results -l; exit 1; }

    # --test=root puts the root's test dependencies in its DAG, and so in its
    # hash: the root tested above is never the one other jobs concretize.
    # Install the root as they see it, from a copy of the env concretized
    # without tests, so the cache holds that one too. Most of its DAG is
    # already installed. Skipped when testing failed.
    - name: Install root for the cache
      if: ${{ inputs.test-mode != 'none' }}
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
      run: |
        cache_env="${ENV_DIR%/}-cache"
        spack env create -d "$cache_env" "$ENV_DIR/spack.yaml"
        spack -e "$cache_env" concretize --deprecated -j "$(nproc)"
        spack -e "$cache_env" install --deprecated -j "$(nproc)" \
          --log-format junit --log-file log-cache.xml

    # always(), not success() or !cancelled(): a package that built is worth
    # caching however the job ended, and cancelled runs are where the partial
    # build saves the most time on the retry. Skipped only when Concretize
    # did not finish, as nothing was built. Forked PRs get a read-only
    # GITHUB_TOKEN whatever 'permissions' says, so the push would 401; reads
    # are anonymous, so they still take from the cache.
    - name: Push packages to cache
      if: >-
        ${{ always() && steps.concretize.outcome == 'success'
        && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository) }}
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
      # No --update-index: it re-reads all ~3600 manifests and writes a
      # snapshot, so concurrent jobs clobber and race it - a tag listed
      # before its manifest is readable aborts the step. Nothing reads it:
      # OCI installs fetch by tag from the spec hash, and reuse is off.
      # Both envs, so the tested root and its test dependencies are cached
      # as well as the untested root.
      run: |
        status=0
        for dir in "$ENV_DIR" "${ENV_DIR%/}-cache"; do
          [ -d "$dir" ] || continue
          spack -e "$dir" buildcache push --base-image ubuntu:26.04 \
            --allow-missing push-buildcache || status=1
        done
        exit "$status"

    # Names must be unique within a run, so squash the spec's punctuation.
    # Not truncated: the distinguishing variants sit at the tail.
    - name: Name log artifact
      id: log
      if: ${{ !cancelled() }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
      run: |
        slug=$(printf '%s' "$SPEC" | tr -cs 'A-Za-z0-9.@+' '-' | sed 's/^-//; s/-$//')
        echo "name=$slug" >> "$GITHUB_OUTPUT"

    - name: Upload log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.log.outputs.name }}-log
        path: |
          log.xml
          log-deps.xml
          log-cache.xml
          ${{ inputs.env-path }}/spack.yaml
          ${{ inputs.env-path }}/spack.lock
        retention-days: 7
