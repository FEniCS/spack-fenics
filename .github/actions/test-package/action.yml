name: test-package
description: 'Builds a spack package from given spack-spec'
inputs:
  spec:
    description: 'Spack spec syntax'
    required: true
  test-mode:
    description: 'Testing mode: none, dependencies (allow cached roots), or root (source install-time tests).'
    default: 'none'
  env-path:
    description: >-
      Directory for the Spack environment. Left in place for the rest of the
      job; read it back from the env-path output rather than repeating it.
    default: ./env
  registry-user:
    description: 'Username for the ghcr.io build cache.'
    default: ${{ github.actor }}
  registry-token:
    description: >-
      Token for the ghcr.io build cache; pass secrets.GITHUB_TOKEN. Exported
      as GHCR_TOKEN, since later install steps re-read the mirror.
    required: true
outputs:
  env-path:
    description: 'Directory of the Spack environment holding the built spec.'
    value: ${{ inputs.env-path }}
  root-hash:
    description: 'Hash of the first concretized root, for staging the tested package.'
    value: ${{ steps.roots.outputs.hash }}
runs:
  using: "composite"
  steps:
    - name: Install Spack requirements
      shell: sh
      env:
        SPEC: ${{ inputs.spec }}
        DEBIAN_FRONTEND: noninteractive
      run: |
        # libclang-rt-18-dev is only a *recommend* of clang-18, so with
        # recommends off any -fsanitize= link fails without it.
        case "$SPEC" in
          *clang@18*) clang="clang-18 libclang-rt-18-dev" ;;
          *) clang="" ;;
        esac
        # Root inside the container, but not on a bare runner.
        sudo=$(command -v sudo || true)
        $sudo apt-get -y update
        # Drops 65 of 174 packages, none of them build inputs: spack builds
        # its own make, curl, libffi and so on.
        $sudo apt-get install -y --no-install-recommends \
          file bzip2 ca-certificates g++ gcc gfortran git gzip lsb-release \
          patch python3 tar unzip xz-utils zstd $clang
        $sudo rm -rf /var/lib/apt/lists/*

    - name: Set up spack
      # Pinned: spack_ref and packages_ref are, so a mutable tag here would
      # be the build's one unpinned input.
      uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3 # v3
      with:
        spack_ref: v1.2.2
        # spack/spack-packages @ 2026-10-14
        packages_ref: 09a7cc27b5d54c9f286cf645a11ae7d95bf38717

    # Job-wide, not step-local: mirrors.yaml stores these names, and spack
    # re-resolves them in every later install step. Not GITHUB_*, which
    # $GITHUB_ENV refuses.
    - name: Export build cache credentials
      shell: bash
      env:
        REGISTRY_USER: ${{ inputs.registry-user }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        echo "::add-mask::$REGISTRY_TOKEN"
        echo "GHCR_USER=$REGISTRY_USER" >> "$GITHUB_ENV"
        echo "GHCR_TOKEN=$REGISTRY_TOKEN" >> "$GITHUB_ENV"

    - name: Add repos
      shell: spack-bash {0}
      run: |
        # From the action's own location, so callers can check out anywhere.
        repo_dir=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)
        spack repo add --name fenics "$repo_dir/spack_repo/fenics"
        spack config get repos
        spack repo list

    - name: Add cache
      shell: spack-bash {0}
      run: |
         # GHCR ties push access to a package's originating repo, which for
         # this one is FEniCS/dolfinx: this repo must be on its Actions
         # access list with the Write role, or every push 403s.
         spack mirror add --unsigned --oci-username-variable GHCR_USER --oci-password-variable GHCR_TOKEN \
           push-buildcache oci://ghcr.io/fenics/spack-buildcache
         spack config add "packages:all:require:['os=ubuntu24.04','target=x86_64_v3']"
         # Pad so pushed binaries stay relocatable: spack can only shrink a
         # prefix, so the build prefix must exceed any consumer's.
         spack config add "config:install_tree:padded_length:128"
         # netlib, NOT openblas: openblas@0.3.34's Zen kernels segfault on
         # high-degree hexahedral H(curl), visible only on the AMD runners.
         # Both virtuals, or openblas returns as the lapack provider;
         # 'require', since a providers preference is only a tie-breaker.
         spack config add "packages:blas:require:netlib-lapack"
         spack config add "packages:lapack:require:netlib-lapack"

    - name: Compiler find
      shell: spack-bash {0}
      run: spack compiler find

    # Spec and env path arrive as variables: GitHub substitutes ${{ }}
    # before bash parses the line, so a metacharacter in a spec would run.
    - name: Create env
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
      run: spack env create -d "$ENV_DIR"

    - name: Add specs
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
        SPEC: ${{ inputs.spec }}
      # $SPEC unquoted: a spec list is meant to split on whitespace here.
      run: spack -e "$ENV_DIR" add $SPEC

    - name: Concretize
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
        TEST_MODE: ${{ inputs.test-mode }}
      run: |
        spack -e "$ENV_DIR" config add concretizer:unify:true
        # Keep the buildcache out of the solve: with reuse on, hashes depend
        # on what the mirror happens to hold, and concurrent jobs push to it.
        # Binaries are still installed on a hash match.
        spack -e "$ENV_DIR" config add concretizer:reuse:false
        args=(--deprecated -j "$(nproc)")
        case "$TEST_MODE" in
          none) ;;
          dependencies|root) args+=(--test=root) ;;
          *) echo "::error::Invalid test-mode: $TEST_MODE"; exit 1 ;;
        esac
        spack -e "$ENV_DIR" concretize "${args[@]}"

    - name: Record root hash
      id: roots
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
      run: |
        root_hash=$(spack -e "$ENV_DIR" python -c 'import spack.environment as ev; print(ev.active_environment().concrete_roots()[0].dag_hash())')
        echo "hash=$root_hash" >> "$GITHUB_OUTPUT"

    - name: Install
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
        TEST_MODE: ${{ inputs.test-mode }}
      run: |
        args=(--deprecated -j "$(nproc)" --log-format junit --log-file log.xml)
        # Explicitly install test dependencies even when the root is cached.
        if [ "$TEST_MODE" != none ]; then
          spack -e "$ENV_DIR" install --deprecated -j "$(nproc)" --test=root --only dependencies --include-build-deps
        fi
        if [ "$TEST_MODE" = root ]; then
          args+=(--test=root --use-buildcache=package:never,dependencies:auto)
        fi
        spack -e "$ENV_DIR" install "${args[@]}"

    # Forked PRs get a read-only GITHUB_TOKEN whatever 'permissions' says,
    # so the push would 401 on a step that tests nothing. Reads are
    # anonymous, so they still take from the cache.
    - name: Push packages to cache
      if: >-
        ${{ !cancelled() && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository) }}
      shell: spack-bash {0}
      env:
        ENV_DIR: ${{ inputs.env-path }}
      # No --update-index: it re-reads all ~3600 manifests and writes a
      # snapshot, so concurrent jobs clobber and race it - a tag listed
      # before its manifest is readable aborts the step. Nothing reads it:
      # OCI installs fetch by tag from the spec hash, and reuse is off.
      run: >
        spack -e "$ENV_DIR" buildcache push --base-image ubuntu:24.04
        --allow-missing push-buildcache

    # Names must be unique within a run, so squash the spec's punctuation.
    # Not truncated: the distinguishing variants sit at the tail.
    - name: Name log artifact
      id: log
      if: ${{ !cancelled() }}
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        TEST_MODE: ${{ inputs.test-mode }}
      run: |
        slug=$(printf '%s' "$SPEC" | tr -cs 'A-Za-z0-9.@+' '-' | sed 's/^-//; s/-$//')
        if [ "$TEST_MODE" = root ]; then
          slug="$slug-test-root"
        fi
        echo "name=$slug" >> "$GITHUB_OUTPUT"

    - name: Upload log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.log.outputs.name }}-log
        path: |
          log.xml
          ${{ inputs.env-path }}/spack.yaml
          ${{ inputs.env-path }}/spack.lock
        retention-days: 7
